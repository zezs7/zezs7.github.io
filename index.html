<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>挖机老板模拟器 2.0</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#101720;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#17202b;border-bottom:1px solid #2d3a48;padding:15px 13px}h1{font-size:22px;margin:0}.sub,.small{font-size:12px;color:#aeb9c6;line-height:1.45}.sub{margin-top:5px}main{max-width:860px;margin:0 auto;padding:10px}.card{background:#1b2530;border:1px solid #2d3a48;border-radius:16px;padding:12px;margin-bottom:10px}h2{font-size:17px;margin:0 0 9px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.stat{background:#121a24;border:1px solid #2d3a48;border-radius:12px;padding:9px}.k{font-size:11px;color:#aeb9c6}.v{font-size:17px;font-weight:800;margin-top:3px}.red{color:#ff7676}.green{color:#62d996}.yellow{color:#ffd166}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}.tabs button{font-size:13px;min-height:38px;padding:6px;background:#263342;color:#e9eef4}.tabs button.on{background:#f5b642;color:#16120a}button{width:100%;min-height:44px;border:0;border-radius:12px;background:#f5b642;color:#16120a;font-size:15px;font-weight:800;margin-top:7px;padding:9px}button:disabled{opacity:.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.gray{background:#dce6ee}.greenbtn{background:#78dda7}.redbtn{background:#ff8b8b}.item{background:#121a24;border:1px solid #2d3a48;border-radius:14px;padding:11px;margin-bottom:9px}.item b{font-size:15px}.item p{font-size:13px;line-height:1.55;color:#bac6d1;margin:6px 0}.tag{display:inline-block;font-size:11px;color:#c7d0da;background:#202b38;border-radius:999px;padding:3px 7px;margin:3px 3px 0 0}.barbox{margin-top:6px;height:9px;border-radius:99px;background:#0c1118;overflow:hidden}.bar{height:100%}#log{max-height:260px;overflow:auto;font-size:12px;line-height:1.55;color:#dce5ed}#log div{padding:5px 0;border-bottom:1px dashed #344354}.hide{display:none}#map{height:170px;background:linear-gradient(#1b2b3a 0 58%,#6a4a30 58%);border:1px solid #2d3a48;border-radius:14px;position:relative;overflow:hidden;margin-top:8px}.zone{position:absolute;border:1px solid #4c6175;background:#202b38;border-radius:12px;padding:6px;font-size:12px}.m{position:absolute;font-size:30px}.sun{position:absolute;right:24px;top:20px;width:28px;height:28px;background:#f5b642;border-radius:50%}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;align-items:center;justify-content:center;padding:18px}.box{background:#1b2530;border:1px solid #2d3a48;border-radius:18px;padding:18px;max-width:460px}</style></head><body><header><h1>🚜 挖机老板模拟器 2.0</h1><div class='sub'>新增：地图接活、拖欠尾款、银行审批、二手车市场、司机性格、品牌性能、行情波动。</div></header><main><section class='card'><h2>公司总览</h2><div class='stats'><div class='stat'><div class='k'>日期</div><div class='v' id='day'></div></div><div class='stat'><div class='k'>现金</div><div class='v' id='cash'></div></div><div class='stat'><div class='k'>贷款</div><div class='v red' id='loan'></div></div><div class='stat'><div class='k'>应收款</div><div class='v yellow' id='ar'></div></div><div class='stat'><div class='k'>口碑</div><div class='v' id='rep'></div></div><div class='stat'><div class='k'>行情</div><div class='v' id='market'></div></div></div><div id='map'></div></section><div class='tabs'><button class='on' data-tab='jobs'>地图接活</button><button data-tab='fleet'>设备</button><button data-tab='marketTab'>市场</button><button data-tab='bank'>银行</button><button data-tab='logTab'>日志</button></div><section class='card tab' id='jobs'><h2>今日工程地图</h2><div id='jobsBox'></div><button class='gray' id='next'>结束今天</button></section><section class='card tab hide' id='fleet'><h2>设备与司机</h2><div id='fleetBox'></div><h2>司机</h2><div id='driverBox'></div><button class='greenbtn' id='hire'>招聘司机 ¥8,000</button></section><section class='card tab hide' id='marketTab'><h2>二手设备市场</h2><div id='saleBox'></div><button class='gray' id='refreshSale'>刷新市场 ¥1,000</button><h2>出售设备</h2><div id='sellBox'></div></section><section class='card tab hide' id='bank'><h2>银行与资金</h2><div class='item'><b>银行审批逻辑</b><p>口碑越高、负债越低、现金流越稳，贷款越容易批。负债太高会被拒。</p><div class='row'><button id='loanSmall'>申请贷款 ¥100,000</button><button id='loanBig'>申请贷款 ¥300,000</button></div><button class='redbtn' id='repay'>主动还款 ¥50,000</button></div><h2>应收工程款</h2><div id='receBox'></div></section><section class='card tab hide' id='logTab'><h2>经营日志</h2><div id='advice' class='item'></div><div id='log'></div><div class='row'><button class='gray' id='save'>保存</button><button class='gray' id='load'>读取</button></div><button class='redbtn' id='reset'>重新开始</button></section></main><div class='modal' id='modal'><div class='box'><h2 id='endTitle'></h2><p id='endText' style='line-height:1.7;color:#dce5ed'></p><button id='again'>再来一局</button></div></div><script>(()=>{const $=id=>document.getElementById(id),fmt=n=>'¥'+Math.round(n).toLocaleString('zh-CN'),rand=(a,b)=>Math.random()*(b-a)+a,pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const brands={小松:{fuel:.95,rel:.9,price:185000,resale:128000},三一:{fuel:1,rel:.82,price:165000,resale:110000},卡特:{fuel:1.08,rel:.94,price:220000,resale:155000},日立:{fuel:.98,rel:.88,price:178000,resale:120000},柳工:{fuel:1.04,rel:.78,price:140000,resale:90000}};const regions=[['市区',1,.9,.18,.85],['乡镇',.85,.75,.1,1],['开发区',1.15,1,.22,1.05],['河道',1.25,1.25,.25,1.15],['矿区',1.45,1.5,.35,1.35]];let g;function init(){g={day:1,cash:160000,loan:260000,rep:52,oil:1,used:1,market:'平稳',demand:1,drivers:[{name:'老板亲自开',trait:'稳健',wage:0,mood:100,busy:false}],fleet:[makeMachine('小松')],jobs:[],sales:[],rece:[],log:['2.0 版开局：你有一台小松，现金 ¥160,000，贷款 ¥260,000。']};makeJobs();makeSales();render()}function makeMachine(b){return{brand:b,name:b+' 200型',health:Math.round(rand(66,88)),age:Math.round(rand(2,8)),busy:false}}function driver(){const names=['老王','小刘','阿强','大海','建军','小马'],traits=['稳健','猛干','会谈','老手','懒散'];return{name:pick(names),trait:pick(traits),wage:Math.round(rand(8500,12500)),mood:Math.round(rand(65,95)),busy:false}}function marketMove(){let r=Math.random();if(r<.25){g.market='活少';g.demand=.82;g.oil=clamp(g.oil+rand(-.04,.08),.75,1.38)}else if(r<.5){g.market='旺季';g.demand=1.18;g.oil=clamp(g.oil+rand(.02,.12),.75,1.38)}else if(r<.72){g.market='油贵';g.demand=1;g.oil=clamp(g.oil+rand(.08,.18),.75,1.45)}else{g.market='平稳';g.demand=1;g.oil=clamp(g.oil+rand(-.07,.07),.75,1.38)}}function makeJobs(){const types=[['挖沟',9000,15000,.08,7],['基础开挖',15000,26000,.16,11],['回填整平',11000,19000,.1,8],['清淤',18000,32000,.23,15],['矿山短租',25000,42000,.32,20],['抢工期夜班',22000,38000,.35,18],['市政管网',17000,30000,.2,13]];g.jobs=[];let n=g.rep>70?6:g.rep>40?5:4;for(let i=0;i<n;i++){let t=pick(types),r=pick(regions),pay=rand(t[1],t[2])*r[1]*g.demand*(1+g.rep/300),fuel=rand(1600,4500)*r[4]*g.oil,wear=t[4]*r[2]*rand(.75,1.2),risk=clamp(t[3]*r[2]-(g.rep-50)/500,.04,.65),ar=clamp(r[3]+(t[0].includes('夜班')?.08:0)-(g.rep-50)/400,.05,.55);g.jobs.push({id:i,type:t[0],region:r[0],pay,fuel,wear,risk,ar,done:false})}}function makeSales(){g.sales=[];['三一','日立','卡特','柳工','小松'].sort(()=>Math.random()-.5).slice(0,3).forEach((b,i)=>{let m=makeMachine(b);m.health=Math.round(rand(48,88));m.price=Math.round(brands[b].price*rand(.72,1.05)*(1+(g.market==='旺季'?.08:g.market==='活少'?-.08:0)));g.sales.push(m)})}function freeM(){return g.fleet.find(x=>!x.busy&&x.health>20)}function freeD(){return g.drivers.find(x=>!x.busy&&x.mood>20)||g.drivers[0]}function doJob(id){let j=g.jobs.find(x=>x.id==id);if(!j||j.done)return;let m=freeM(),d=freeD();if(!m)return note('没有可用挖机，健康低于 20 的设备必须先维修。');if(d.trait==='懒散'&&Math.random()<.12){d.mood-=10;return note(d.name+' 临时请假，这个活没接成。')}j.done=true;m.busy=true;d.busy=true;let bs=brands[m.brand],pay=j.pay,cost=j.fuel*bs.fuel,wear=j.wear*(1+(100-m.health)/220),risk=j.risk+(1-bs.rel)*.25,ar=j.ar,rep=1,extra='';if(d.trait==='稳健'){risk-=.06;wear*=.9}if(d.trait==='猛干'){pay*=1.1;wear*=1.22;risk+=.05}if(d.trait==='会谈'){ar-=.12;rep+=1}if(d.trait==='老手'){risk-=.05;cost*=.94;wear*=.88}if(d.trait==='懒散'){risk+=.08;rep-=1}risk=clamp(risk,.03,.75);ar=clamp(ar,.02,.75);if(Math.random()<risk){let loss=rand(5000,19000);cost+=loss;wear+=rand(4,12);rep-=3;extra=' 现场出问题，额外损失 '+fmt(loss)+'。'}m.health=clamp(m.health-wear,0,100);d.mood=clamp(d.mood-rand(3,9),0,100);if(Math.random()<ar){let due=g.day+Math.ceil(rand(3,12)),bad=clamp(ar*.45,.03,.4);g.cash-=cost;g.rece.push({from:j.region+j.type,amount:pay,due,bad});extra+=' 甲方拖欠，形成应收款 '+fmt(pay)+'。'}else{g.cash+=pay-cost;extra+=' 现金到账，净赚 '+fmt(pay-cost)+'。'}g.rep=clamp(g.rep+rep,0,100);note(m.name+' + '+d.name+' 完成【'+j.region+'·'+j.type+'】。'+extra);render()}function nextDay(){if(g.day>=60)return end();g.day++;let wages=g.drivers.reduce((s,d)=>s+d.wage/30,0),interest=g.loan*.0009,yard=g.fleet.length*220;g.cash-=wages+interest+yard;g.loan+=interest;g.fleet.forEach(m=>{m.busy=false;if(Math.random()<.06)m.health=clamp(m.health-rand(2,7),0,100)});g.drivers.forEach(d=>{d.busy=false;d.mood=clamp(d.mood+rand(1,5),0,100)});g.rece.forEach(r=>{if(!r.done&&r.due<=g.day){if(Math.random()>r.bad){g.cash+=r.amount;r.done=true;note('应收款到账：'+r.from+' '+fmt(r.amount))}else{r.due+=Math.ceil(rand(3,8));r.amount*=.96;note('坏消息：'+r.from+' 继续拖款，还被压价 4%。')}}});g.rece=g.rece.filter(r=>!r.done);if(g.day%5===0){marketMove();makeSales();note('市场变化：'+g.market+'，油价指数 '+g.oil.toFixed(2)+'。')}if(Math.random()<.18){let e=pick([()=>{g.rep=clamp(g.rep+3,0,100);return'老客户介绍新工程，口碑 +3。'},()=>{g.cash-=4200;return'拖车、保险、杂费支出 '+fmt(4200)+'。'},()=>{g.cash+=8000;return'一笔小尾款提前到账 '+fmt(8000)+'。'}]);note('随机事件：'+e())}makeJobs();note('进入第 '+g.day+' 天。工资/利息/场地支出 '+fmt(wages+interest+yard)+'。');render()}function buy(i){let s=g.sales[i];if(!s)return;if(g.cash<s.price)return note('现金不够买这台二手车。');g.cash-=s.price;g.fleet.push({brand:s.brand,name:s.name,health:s.health,age:s.age,busy:false});note('买入二手 '+s.name+'，价格 '+fmt(s.price)+'，健康度 '+s.health+'。');makeSales();render()}function sell(i){if(g.fleet.length<=1)return note('至少保留一台挖机。');let m=g.fleet[i],price=Math.round(brands[m.brand].resale*(m.health/100)*(1-m.age*.025)*(g.market==='旺季'?1.08:g.market==='活少'?.9:1));g.cash+=price;g.fleet.splice(i,1);note('出售 '+m.name+'，回笼资金 '+fmt(price)+'。');render()}function hire(){if(g.cash<8000)return note('现金不足，招不起司机。');let d=driver();g.cash-=8000;g.drivers.push(d);note('招聘 '+d.name+'，性格【'+d.trait+'】，月薪 '+fmt(d.wage)+'。');render()}function repair(i){let m=g.fleet[i],cost=Math.round((100-m.health)*560);if(cost<=0)return note('这台设备状态很好。');if(g.cash<cost)return note('维修需要 '+fmt(cost)+'，现金不足。');g.cash-=cost;m.health=100;note('维修 '+m.name+'，花费 '+fmt(cost)+'。');render()}function loan(a){let score=g.rep+g.cash/9000-g.loan/12000+rand(-15,25);if(score<45)return note('银行拒绝：负债偏高或口碑/现金流不足。');g.cash+=a;g.loan+=a;note('银行审批通过，贷款到账 '+fmt(a)+'。');render()}function repay(){let a=Math.min(50000,g.loan);if(g.cash<a)return note('现金不足，无法还款。');g.cash-=a;g.loan-=a;note('主动还款 '+fmt(a)+'。');render()}function advice(){let avg=g.fleet.reduce((s,m)=>s+m.health,0)/g.fleet.length,ar=g.rece.reduce((s,r)=>s+r.amount,0);if(g.cash<30000)return'现金流危险：少接拖款概率高的活，优先市区/乡镇现金活。';if(ar>g.cash*1.2)return'应收款过大：账面赚钱不等于活着，别被尾款拖死。';if(avg<45)return'设备健康偏低：先维修，不然一次故障会吞掉好几天利润。';if(g.loan>450000)return'负债偏高：暂停扩张，优先还贷款。';if(g.market==='旺季'&&g.cash>220000)return'旺季可以扩张，但只买健康度高、残值好的车。';return'稳住：高风险高利润的活，只在现金充足、设备健康、司机状态好时接。'}function end(){let asset=g.fleet.reduce((s,m)=>s+brands[m.brand].resale*(m.health/100),0),ar=g.rece.reduce((s,r)=>s+r.amount*.72,0),net=g.cash+asset+ar-g.loan,title=net>600000?'结局：机械公司起飞':net>150000?'结局：公司活下来了':'结局：被现金流打败';$('endTitle').textContent=title;$('endText').textContent='60 天结束，估算净资产 '+fmt(net)+'，现金 '+fmt(g.cash)+'，应收款 '+fmt(ar)+'，口碑 '+Math.round(g.rep)+'。经营真相：利润、回款、负债、设备状态必须一起看。';$('modal').style.display='flex'}function note(t){g.log.unshift('• '+t);g.log=g.log.slice(0,80)}function save(){localStorage.setItem('wajiBoss2',JSON.stringify(g));note('已保存。');render()}function load(){let d=localStorage.getItem('wajiBoss2');if(!d)return note('没有存档。');g=JSON.parse(d);note('已读取存档。');render()}function tab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hide'));$(id).classList.remove('hide');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===id))}function render(){$('day').textContent=g.day+' / 60';$('cash').textContent=fmt(g.cash);$('cash').className='v '+(g.cash<30000?'red':g.cash>250000?'green':'');$('loan').textContent=fmt(g.loan);let ar=g.rece.reduce((s,r)=>s+r.amount,0);$('ar').textContent=fmt(ar);$('rep').textContent=Math.round(g.rep);$('rep').className='v '+(g.rep<35?'red':g.rep>70?'green':'');$('market').textContent=g.market;let map=$('map');map.innerHTML='<div class=sun></div>';regions.forEach((r,i)=>{let z=document.createElement('div');z.className='zone';z.style.left=[8,48,18,60,36][i]+'%';z.style.top=[18,24,58,57,38][i]+'%';z.textContent=r[0];map.appendChild(z)});g.fleet.slice(0,6).forEach((m,i)=>{let e=document.createElement('div');e.className='m';e.style.left=(8+i*14)+'%';e.style.bottom='10px';e.style.opacity=m.health<35?.45:1;e.textContent='🚜';map.appendChild(e)});$('jobsBox').innerHTML=g.jobs.map(j=>`<div class='item'><b>${j.region} · ${j.type}</b><br><span class='tag'>收入 ${fmt(j.pay)}</span><span class='tag'>油费 ${fmt(j.fuel)}</span><span class='tag'>故障 ${Math.round(j.risk*100)}%</span><span class='tag'>拖款 ${Math.round(j.ar*100)}%</span><p>地区影响：越远油费越高，矿区/河道利润高但磨损和风险也高。</p><button ${j.done?'disabled':''} onclick='doJob(${j.id})'>${j.done?'已完成':'接这个活'}</button></div>`).join('');$('fleetBox').innerHTML=g.fleet.map((m,i)=>{let color=m.health<35?'#ff7070':m.health<65?'#ffd166':'#55d18f',b=brands[m.brand];return`<div class='item'><b>${i+1}. ${m.name}</b><br><span class='tag'>品牌可靠 ${Math.round(b.rel*100)}%</span><span class='tag'>油耗 ${b.fuel.toFixed(2)}</span><span class='tag'>车龄 ${m.age} 年</span><p>状态：${m.busy?'施工中':'空闲'}｜健康度 ${Math.round(m.health)}</p><div class='barbox'><div class='bar' style='width:${m.health}%;background:${color}'></div></div><button class='gray' onclick='repair(${i})'>维修保养</button></div>`}).join('');$('driverBox').innerHTML=g.drivers.map(d=>`<div class='item'><b>${d.name}</b><br><span class='tag'>${d.trait}</span><span class='tag'>月薪 ${fmt(d.wage)}</span><span class='tag'>心情 ${Math.round(d.mood)}</span><p>${d.trait==='稳健'?'降低风险和磨损':d.trait==='猛干'?'提高收入但增加磨损':d.trait==='会谈'?'降低拖款概率':d.trait==='老手'?'省油、省车、少出事':'可能请假，风险更高'}</p></div>`).join('');$('saleBox').innerHTML=g.sales.map((s,i)=>`<div class='item'><b>${s.name}</b><br><span class='tag'>价格 ${fmt(s.price)}</span><span class='tag'>健康 ${s.health}</span><span class='tag'>车龄 ${s.age} 年</span><p>${s.brand}：油耗 ${brands[s.brand].fuel.toFixed(2)}，可靠 ${Math.round(brands[s.brand].rel*100)}%，残值 ${fmt(brands[s.brand].resale)}。</p><button onclick='buy(${i})'>买入</button></div>`).join('');$('sellBox').innerHTML=g.fleet.map((m,i)=>`<div class='item'><b>${m.name}</b><p>健康 ${Math.round(m.health)}，车龄 ${m.age} 年。旺季更容易卖高价。</p><button class='redbtn' onclick='sell(${i})'>出售估价</button></div>`).join('');$('receBox').innerHTML=g.rece.length?g.rece.map(r=>`<div class='item'><b>${r.from}</b><p>金额 ${fmt(r.amount)}｜预计第 ${r.due} 天｜坏账风险 ${Math.round(r.bad*100)}%</p></div>`).join(''):'<div class=item>暂无应收款。</div>';$('advice').textContent=advice();$('log').innerHTML=g.log.map(x=>'<div>'+x+'</div>').join('');if(g.cash<-80000)end()}window.doJob=doJob;window.buy=buy;window.sell=sell;window.repair=repair;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('next').onclick=nextDay;$('hire').onclick=hire;$('refreshSale').onclick=()=>{if(g.cash<1000)return note('现金不足，无法刷新市场。');g.cash-=1000;makeSales();note('已刷新二手市场。');render()};$('loanSmall').onclick=()=>loan(100000);$('loanBig').onclick=()=>loan(300000);$('repay').onclick=repay;$('save').onclick=save;$('load').onclick=()=>{load();render()};$('reset').onclick=init;$('again').onclick=()=>{$('modal').style.display='none';init()};init()})();</script></body></html>
