<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>挖机老板模拟器 3.0</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#0f1720;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif}header{position:sticky;top:0;z-index:8;background:#17202b;border-bottom:1px solid #2d3b49;padding:14px 12px}h1{font-size:21px;margin:0}.sub,.mini{font-size:12px;color:#aeb9c6;line-height:1.45}.sub{margin-top:5px}main{max-width:920px;margin:0 auto;padding:10px}.card{background:#1b2530;border:1px solid #2d3b49;border-radius:16px;padding:12px;margin-bottom:10px}h2{font-size:17px;margin:0 0 9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#121a24;border:1px solid #2d3b49;border-radius:12px;padding:9px}.k{font-size:11px;color:#aeb9c6}.v{font-size:16px;font-weight:800;margin-top:3px}.red{color:#ff7676}.green{color:#62d996}.yellow{color:#ffd166}.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}.tabs button{font-size:12px;min-height:38px;padding:6px;background:#263342;color:#e9eef4}.tabs button.on{background:#f5b642;color:#16120a}button{width:100%;min-height:43px;border:0;border-radius:12px;background:#f5b642;color:#16120a;font-size:14px;font-weight:800;margin-top:7px;padding:9px}button:disabled{opacity:.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.gray{background:#dce6ee}.greenbtn{background:#78dda7}.redbtn{background:#ff8b8b}.item{background:#121a24;border:1px solid #2d3b49;border-radius:14px;padding:11px;margin-bottom:9px}.item b{font-size:15px}.item p{font-size:13px;line-height:1.55;color:#bac6d1;margin:6px 0}.tag{display:inline-block;font-size:11px;color:#c7d0da;background:#202b38;border-radius:999px;padding:3px 7px;margin:3px 3px 0 0}.barbox{margin-top:6px;height:9px;border-radius:99px;background:#0c1118;overflow:hidden}.bar{height:100%;background:#62d996}.hide{display:none}#map{height:168px;background:linear-gradient(#1b2b3a 0 58%,#6a4a30 58%);border:1px solid #2d3b49;border-radius:14px;position:relative;overflow:hidden;margin-top:8px}.zone{position:absolute;border:1px solid #4c6175;background:#202b38;border-radius:12px;padding:6px;font-size:12px}.m{position:absolute;font-size:30px}.sun{position:absolute;right:24px;top:18px;width:28px;height:28px;background:#f5b642;border-radius:50%}#log{max-height:290px;overflow:auto;font-size:12px;line-height:1.55;color:#dce5ed}#log div{padding:5px 0;border-bottom:1px dashed #344354}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;align-items:center;justify-content:center;padding:18px}.box{background:#1b2530;border:1px solid #2d3b49;border-radius:18px;padding:18px;max-width:460px}@media(max-width:520px){.tabs{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.row3{grid-template-columns:1fr}}</style></head><body><header><h1>🚜 挖机老板模拟器 3.0</h1><div class='sub'>复杂经营版：合同周期、多日施工、派车派司机、分期回款、设备三大件、安全事故、保险、培训、营销、财务报表。</div></header><main><section class='card'><h2>公司驾驶舱</h2><div class='stats'><div class='stat'><div class='k'>日期</div><div class='v' id='day'></div></div><div class='stat'><div class='k'>现金</div><div class='v' id='cash'></div></div><div class='stat'><div class='k'>贷款</div><div class='v red' id='loan'></div></div><div class='stat'><div class='k'>应收款</div><div class='v yellow' id='ar'></div></div><div class='stat'><div class='k'>口碑 / 信用</div><div class='v' id='score'></div></div><div class='stat'><div class='k'>安全 / 行情</div><div class='v' id='safety'></div></div></div><div id='map'></div></section><div class='tabs'><button class='on' data-tab='contracts'>合同</button><button data-tab='projects'>施工</button><button data-tab='fleet'>车队</button><button data-tab='staff'>人员</button><button data-tab='market'>市场</button><button data-tab='finance'>财务</button><button data-tab='logs'>日志</button></div><section class='card tab' id='contracts'><h2>可接合同</h2><div id='contractsBox'></div><button class='gray' id='refreshContracts'>跑业务刷新合同 ¥2,000</button></section><section class='card tab hide' id='projects'><h2>在建项目</h2><div id='projectsBox'></div><button id='nextDay'>推进一天施工</button></section><section class='card tab hide' id='fleet'><h2>设备三大件</h2><div id='fleetBox'></div></section><section class='card tab hide' id='staff'><h2>司机与管理</h2><div id='staffBox'></div><div class='row'><button id='hireDriver'>招聘司机 ¥8,000</button><button class='greenbtn' id='train'>安全培训 ¥6,000</button></div><button class='gray' id='bonus'>全员发奖金 ¥5,000/人</button></section><section class='card tab hide' id='market'><h2>二手设备市场</h2><div id='salesBox'></div><button class='gray' id='refreshSales'>刷新二手市场 ¥1,000</button><h2>出售设备</h2><div id='sellBox'></div></section><section class='card tab hide' id='finance'><h2>银行与保险</h2><div class='row'><button id='loan10'>贷款 ¥100,000</button><button id='loan30'>贷款 ¥300,000</button></div><button class='redbtn' id='repay'>主动还款 ¥50,000</button><button class='greenbtn' id='insure'>购买/续保工程险 ¥18,000</button><h2>应收款账龄</h2><div id='receBox'></div><h2>经营报表</h2><div id='reportBox'></div></section><section class='card tab hide' id='logs'><h2>经营建议</h2><div class='item' id='advice'></div><h2>经营日志</h2><div id='log'></div><div class='row'><button class='gray' id='save'>保存</button><button class='gray' id='load'>读取</button></div><button class='redbtn' id='reset'>重新开始</button></section></main><div class='modal' id='modal'><div class='box'><h2 id='endTitle'></h2><p id='endText' style='line-height:1.7;color:#dce5ed'></p><button id='again'>再来一局</button></div></div><script>(()=>{const $=id=>document.getElementById(id),fmt=n=>'¥'+Math.round(n).toLocaleString('zh-CN'),rand=(a,b)=>Math.random()*(b-a)+a,pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const B={小松:{fuel:.95,rel:.9,resale:128000,price:185000},三一:{fuel:1,rel:.82,resale:110000,price:165000},卡特:{fuel:1.08,rel:.94,resale:155000,price:220000},日立:{fuel:.98,rel:.88,resale:120000,price:178000},柳工:{fuel:1.04,rel:.78,resale:90000,price:140000}};const REG=[['市区',1,.9,.18,.85],['乡镇',.85,.75,.1,1],['开发区',1.15,1,.22,1.05],['河道',1.28,1.25,.28,1.15],['矿区',1.48,1.55,.36,1.35]];let g;function machine(b){return{id:Date.now()+Math.random(),brand:b,name:b+' 200型',age:Math.round(rand(2,8)),engine:Math.round(rand(66,90)),hyd:Math.round(rand(66,90)),track:Math.round(rand(66,90)),hours:Math.round(rand(1800,7200)),attach:['标准斗'],busy:false}}function driver(){const names=['老王','小刘','阿强','大海','建军','小马','阿峰','老赵'],traits=['稳健','猛干','会谈','老手','懒散','省油'];return{id:Date.now()+Math.random(),name:pick(names),trait:pick(traits),skill:Math.round(rand(48,82)),fatigue:0,wage:Math.round(rand(8500,12500)),busy:false}}function init(){g={day:1,cash:220000,loan:320000,rep:55,credit:60,safe:55,market:'平稳',demand:1,fuel:1,part:1,insured:false,contracts:[],projects:[],rece:[],sales:[],fleet:[machine('小松')],drivers:[{id:1,name:'老板亲自开',trait:'稳健',skill:68,fatigue:0,wage:0,busy:false}],pnl:{rev:0,cost:0,repair:0,wage:0,interest:0,other:0},log:['3.0 开局：现金 ¥220,000，贷款 ¥320,000，一台小松，一人创业。']};makeContracts();makeSales();render()}function health(m){return Math.round((m.engine+m.hyd+m.track)/3)}function needAttach(t){return t.includes('破碎')?'破碎锤':t.includes('清淤')?'清淤斗':'标准斗'}function makeContracts(){const types=[['小区回填',2,11000,19000,.09,8],['基础开挖',3,16000,30000,.16,11],['市政管网',4,18000,34000,.19,12],['河道清淤',4,22000,42000,.25,15],['矿山短租',5,30000,56000,.34,20],['抢工期夜班',3,24000,45000,.38,17],['破碎拆除',4,26000,50000,.3,18]];g.contracts=[];let n=4+Math.floor(g.rep/35)+Math.floor(g.credit/55);for(let i=0;i<n;i++){let t=pick(types),r=pick(REG),pay=rand(t[2],t[3])*r[1]*g.demand*(1+g.rep/320),advance=pick([.2,.3,.4,.5]),days=t[1]+Math.round(rand(0,2)),risk=clamp(t[4]*r[2]-(g.safe-50)/500,.03,.7),ar=clamp(r[3]+(t[0].includes('夜班')?.08:0)-(g.credit-50)/400,.04,.68);g.contracts.push({id:Date.now()+i,name:r[0]+'·'+t[0],region:r[0],type:t[0],pay,advance,days,risk,ar,wear:t[5]*r[2],fuel:rand(1800,5200)*r[4]*g.fuel,req:needAttach(t[0]),owner:pick(['国企分包','私人老板','地产项目','市政项目','矿区老板','老客户'])})}}function makeSales(){g.sales=[];Object.keys(B).sort(()=>Math.random()-.5).slice(0,3).forEach(b=>{let m=machine(b);m.engine=Math.round(rand(45,88));m.hyd=Math.round(rand(45,88));m.track=Math.round(rand(45,88));m.price=Math.round(B[b].price*rand(.68,1.05)*(g.market==='旺季'?1.08:g.market==='活少'?.9:1));g.sales.push(m)})}function freeM(req){return g.fleet.find(m=>!m.busy&&health(m)>25&&m.attach.includes(req))}function freeD(){return g.drivers.find(d=>!d.busy&&d.fatigue<85)}function accept(id){let c=g.contracts.find(x=>x.id==id);if(!c)return;let m=freeM(c.req),d=freeD();if(!m)return note('接不了：缺少可用设备或缺少 '+c.req+'。');if(!d)return note('接不了：没有状态合适的司机。');m.busy=true;d.busy=true;let adv=c.pay*c.advance;g.cash+=adv;g.pnl.rev+=adv;g.projects.push({...c,mid:m.id,did:d.id,progress:0,earned:adv,status:'施工中'});g.contracts=g.contracts.filter(x=>x.id!=id);note('签下合同【'+c.name+'】，预付款 '+fmt(adv)+'，派 '+m.name+' + '+d.name+'。');render()}function findM(id){return g.fleet.find(x=>x.id==id)}function findD(id){return g.drivers.find(x=>x.id==id)}function workOneDay(){if(g.day>=90)return finish();g.day++;let wages=g.drivers.reduce((s,d)=>s+d.wage/30,0),interest=g.loan*.0009,yard=g.fleet.length*260,base=wages+interest+yard;g.cash-=base;g.pnl.wage+=wages;g.pnl.interest+=interest;g.pnl.other+=yard;g.loan+=interest;g.fleet.forEach(m=>m.busy=false);g.drivers.forEach(d=>d.busy=false);g.projects.forEach(p=>{let m=findM(p.mid),d=findD(p.did);if(!m||!d||p.status!=='施工中')return;let h=health(m),brand=B[m.brand],speed=clamp((d.skill/65)*(h/75)*(d.fatigue>70?.75:1),.35,1.35);let cost=p.fuel*brand.fuel*(g.market==='油贵'?1.15:1);g.cash-=cost;g.pnl.cost+=cost;p.progress+=speed;m.engine=clamp(m.engine-p.wear*rand(.08,.18),0,100);m.hyd=clamp(m.hyd-p.wear*rand(.12,.24),0,100);m.track=clamp(m.track-p.wear*rand(.1,.22),0,100);m.hours+=Math.round(rand(6,10));d.fatigue=clamp(d.fatigue+rand(8,16),0,100);let accidentRisk=p.risk*(1-g.safe/170)*(1+(100-h)/160)*(1+d.fatigue/220);if(Math.random()<accidentRisk){let loss=rand(6000,26000);if(g.insured)loss*=.45;g.cash-=loss;g.pnl.repair+=loss;g.rep=clamp(g.rep-3,0,100);g.safe=clamp(g.safe-4,0,100);note('事故：'+p.name+' 发生故障/纠纷，损失 '+fmt(loss)+(g.insured?'，保险已减损。':'。'))}if(p.progress>=p.days){complete(p)}});processRece();if(g.day%7===0)marketMove();if(Math.random()<.18)randomEvent();makeContracts();note('进入第 '+g.day+' 天，固定支出 '+fmt(base)+'。');render()}function complete(p){p.status='完工';let rest=p.pay-p.earned;if(Math.random()<p.ar){let due=g.day+Math.ceil(rand(5,18)),bad=clamp(p.ar*.42,.03,.38);g.rece.push({name:p.name,amount:rest,due,bad,age:0});note('完工【'+p.name+'】，尾款 '+fmt(rest)+' 转为应收款，预计第 '+due+' 天。')}else{g.cash+=rest;g.pnl.rev+=rest;note('完工【'+p.name+'】，尾款现金到账 '+fmt(rest)+'。')}g.rep=clamp(g.rep+2,0,100);g.credit=clamp(g.credit+1,0,100);let m=findM(p.mid),d=findD(p.did);if(m)m.busy=false;if(d)d.busy=false}function processRece(){g.rece.forEach(r=>{r.age++;if(r.due<=g.day&&!r.done){if(Math.random()>r.bad){g.cash+=r.amount;g.pnl.rev+=r.amount;r.done=true;g.credit=clamp(g.credit+2,0,100);note('回款到账：'+r.name+' '+fmt(r.amount))}else{r.due+=Math.ceil(rand(4,10));r.amount*=.96;g.credit=clamp(g.credit-2,0,100);note('拖款：'+r.name+' 继续拖延，并压价 4%。')}}});g.rece=g.rece.filter(r=>!r.done);g.projects=g.projects.filter(p=>p.status==='施工中')}function marketMove(){let r=Math.random();if(r<.25){g.market='活少';g.demand=.82;g.fuel=clamp(g.fuel+rand(-.04,.05),.75,1.45)}else if(r<.5){g.market='旺季';g.demand=1.18;g.fuel=clamp(g.fuel+rand(.02,.1),.75,1.5)}else if(r<.72){g.market='油贵';g.demand=1;g.fuel=clamp(g.fuel+rand(.1,.18),.75,1.58)}else{g.market='平稳';g.demand=1;g.fuel=clamp(g.fuel+rand(-.07,.07),.75,1.45)}g.part=clamp(g.part+rand(-.05,.08),.82,1.35);makeSales();note('市场变化：'+g.market+'，油价 '+g.fuel.toFixed(2)+'，配件价 '+g.part.toFixed(2)+'。')}function randomEvent(){let e=pick([()=>{g.rep=clamp(g.rep+3,0,100);return'老客户介绍新甲方，口碑 +3。'},()=>{g.cash-=5000;g.pnl.other+=5000;return'环保检查和杂费支出 '+fmt(5000)+'。'},()=>{g.safe=clamp(g.safe-3,0,100);return'司机连续赶工，安全评分 -3。'},()=>{g.credit=clamp(g.credit+3,0,100);return'你主动催款但态度得当，信用 +3。'}]);note('随机事件：'+e())}function repair(id,part){let m=findM(id);if(!m)return;let need=100-m[part],cost=Math.round(need*620*g.part);if(cost<=0)return note('这项状态很好。');if(g.cash<cost)return note('维修需要 '+fmt(cost)+'，现金不足。');g.cash-=cost;g.pnl.repair+=cost;m[part]=100;note('维修 '+m.name+' 的'+({engine:'发动机',hyd:'液压',track:'底盘'}[part])+'，花费 '+fmt(cost)+'。');render()}function addAttach(id,a){let m=findM(id);if(!m)return;if(m.attach.includes(a))return note(m.name+' 已有 '+a+'。');let cost=a==='破碎锤'?35000:22000;if(g.cash<cost)return note('改装需要 '+fmt(cost)+'，现金不足。');g.cash-=cost;g.pnl.other+=cost;m.attach.push(a);note('给 '+m.name+' 加装 '+a+'，花费 '+fmt(cost)+'。');render()}function buy(i){let s=g.sales[i];if(!s)return;if(g.cash<s.price)return note('现金不足。');g.cash-=s.price;g.fleet.push(s);note('买入二手 '+s.name+'，价格 '+fmt(s.price)+'，综合健康 '+health(s)+'。');makeSales();render()}function sell(id){if(g.fleet.length<=1)return note('至少保留一台设备。');let i=g.fleet.findIndex(m=>m.id==id),m=g.fleet[i],price=Math.round(B[m.brand].resale*(health(m)/100)*(1-m.age*.025)*(g.market==='旺季'?1.08:g.market==='活少'?.9:1));g.cash+=price;g.fleet.splice(i,1);note('出售 '+m.name+'，回笼 '+fmt(price)+'。');render()}function hire(){if(g.cash<8000)return note('现金不足，招不起司机。');let d=driver();g.cash-=8000;g.drivers.push(d);note('招聘 '+d.name+'，性格【'+d.trait+'】，技能 '+d.skill+'，月薪 '+fmt(d.wage)+'。');render()}function train(){if(g.cash<6000)return note('现金不足。');g.cash-=6000;g.safe=clamp(g.safe+7,0,100);g.drivers.forEach(d=>d.skill=clamp(d.skill+2,0,100));note('安全培训完成：安全 +7，全员技能 +2。');render()}function bonus(){let cost=g.drivers.length*5000;if(g.cash<cost)return note('现金不足，发不了奖金。');g.cash-=cost;g.drivers.forEach(d=>d.fatigue=clamp(d.fatigue-22,0,100));note('全员奖金 '+fmt(cost)+'，司机疲劳明显下降。');render()}function loan(a){let score=g.credit+g.rep/2+g.cash/12000-g.loan/14000+rand(-15,18);if(score<55)return note('银行拒绝：信用、负债或现金流不达标。');g.cash+=a;g.loan+=a;note('贷款审批通过，到账 '+fmt(a)+'。');render()}function repay(){let a=Math.min(50000,g.loan);if(g.cash<a)return note('现金不足。');g.cash-=a;g.loan-=a;g.credit=clamp(g.credit+2,0,100);note('主动还款 '+fmt(a)+'，信用 +2。');render()}function insure(){if(g.cash<18000)return note('现金不足，买不了保险。');g.cash-=18000;g.insured=true;note('工程险生效：事故损失大幅降低，本轮经营有效。');render()}function refreshContracts(){if(g.cash<2000)return note('现金不足。');g.cash-=2000;g.rep=clamp(g.rep+1,0,100);makeContracts();note('跑业务刷新合同，口碑 +1。');render()}function refreshSales(){if(g.cash<1000)return note('现金不足。');g.cash-=1000;makeSales();note('刷新二手设备市场。');render()}function advice(){let ar=g.rece.reduce((s,r)=>s+r.amount,0),avg=g.fleet.reduce((s,m)=>s+health(m),0)/g.fleet.length;if(g.cash<40000)return'现金流危险：不要接高拖款合同，先找预付款高的活。';if(ar>g.cash*1.4)return'应收款过大：账上利润不等于现金，优先催款和控制扩张。';if(avg<50)return'设备三大件偏弱：发动机、液压、底盘任一项太低都会放大事故风险。';if(g.safe<45)return'安全评分偏低：建议培训或减少夜班、矿区活，否则一次事故吞掉利润。';if(g.loan>550000)return'负债过高：银行会越来越难批款，先还债。';return'稳健策略：旺季可以扩张，但要保证司机状态、设备健康、预付款比例。'}function finish(){let asset=g.fleet.reduce((s,m)=>s+B[m.brand].resale*(health(m)/100),0),ar=g.rece.reduce((s,r)=>s+r.amount*.72,0),net=g.cash+asset+ar-g.loan,title=net>900000?'结局：区域机械公司':net>260000?'结局：稳健老板':'结局：现金流危机';$('endTitle').textContent=title;$('endText').textContent='90 天结束，估算净资产 '+fmt(net)+'，现金 '+fmt(g.cash)+'，设备残值 '+fmt(asset)+'，应收款折算 '+fmt(ar)+'，贷款 '+fmt(g.loan)+'。';$('modal').style.display='flex'}function note(t){g.log.unshift('• '+t);g.log=g.log.slice(0,120)}function save(){localStorage.setItem('wajiBoss3',JSON.stringify(g));note('已保存。');render()}function load(){let d=localStorage.getItem('wajiBoss3');if(!d)return note('没有 3.0 存档。');g=JSON.parse(d);note('已读取 3.0 存档。');render()}function tab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hide'));$(id).classList.remove('hide');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===id))}function color(v){return v<35?'#ff7676':v<65?'#ffd166':'#62d996'}function render(){$('day').textContent=g.day+' / 90';$('cash').textContent=fmt(g.cash);$('cash').className='v '+(g.cash<40000?'red':g.cash>300000?'green':'');$('loan').textContent=fmt(g.loan);let ar=g.rece.reduce((s,r)=>s+r.amount,0);$('ar').textContent=fmt(ar);$('score').textContent=Math.round(g.rep)+' / '+Math.round(g.credit);$('safety').textContent=Math.round(g.safe)+' / '+g.market;let map=$('map');map.innerHTML='<div class=sun></div>';REG.forEach((r,i)=>{let z=document.createElement('div');z.className='zone';z.style.left=[8,48,18,60,36][i]+'%';z.style.top=[18,24,58,57,38][i]+'%';z.textContent=r[0];map.appendChild(z)});g.fleet.slice(0,7).forEach((m,i)=>{let e=document.createElement('div');e.className='m';e.style.left=(6+i*13)+'%';e.style.bottom='10px';e.style.opacity=health(m)<35?.45:1;e.textContent='🚜';map.appendChild(e)});$('contractsBox').innerHTML=g.contracts.map(c=>`<div class='item'><b>${c.name}</b><br><span class='tag'>甲方 ${c.owner}</span><span class='tag'>总价 ${fmt(c.pay)}</span><span class='tag'>预付 ${Math.round(c.advance*100)}%</span><span class='tag'>工期 ${c.days}天</span><span class='tag'>需 ${c.req}</span><span class='tag'>事故 ${Math.round(c.risk*100)}%</span><span class='tag'>拖款 ${Math.round(c.ar*100)}%</span><p>接下后会占用一台设备和一名司机，按天推进施工，完工后尾款可能现金到账，也可能变成应收款。</p><button onclick='accept(${c.id})'>签合同并派工</button></div>`).join('');$('projectsBox').innerHTML=g.projects.length?g.projects.map(p=>`<div class='item'><b>${p.name}</b><br><span class='tag'>进度 ${Math.min(100,Math.round(p.progress/p.days*100))}%</span><span class='tag'>总价 ${fmt(p.pay)}</span><span class='tag'>已收 ${fmt(p.earned)}</span><span class='tag'>需 ${p.req}</span><p>设备：${findM(p.mid)?.name||'未知'}｜司机：${findD(p.did)?.name||'未知'}</p><div class='barbox'><div class='bar' style='width:${Math.min(100,p.progress/p.days*100)}%'></div></div></div>`).join(''):'<div class=item>暂无在建项目。去合同页签约。</div>';$('fleetBox').innerHTML=g.fleet.map(m=>`<div class='item'><b>${m.name}</b><br><span class='tag'>综合 ${health(m)}</span><span class='tag'>车龄 ${m.age}年</span><span class='tag'>小时 ${m.hours}</span><span class='tag'>属具 ${m.attach.join('/')}</span><p>发动机 ${Math.round(m.engine)}</p><div class='barbox'><div class='bar' style='width:${m.engine}%;background:${color(m.engine)}'></div></div><p>液压 ${Math.round(m.hyd)}</p><div class='barbox'><div class='bar' style='width:${m.hyd}%;background:${color(m.hyd)}'></div></div><p>底盘 ${Math.round(m.track)}</p><div class='barbox'><div class='bar' style='width:${m.track}%;background:${color(m.track)}'></div></div><div class='row3'><button class='gray' onclick='repair(${m.id},"engine")'>修发动机</button><button class='gray' onclick='repair(${m.id},"hyd")'>修液压</button><button class='gray' onclick='repair(${m.id},"track")'>修底盘</button></div><div class='row'><button onclick='addAttach(${m.id},"破碎锤")'>装破碎锤</button><button onclick='addAttach(${m.id},"清淤斗")'>装清淤斗</button></div></div>`).join('');$('staffBox').innerHTML=g.drivers.map(d=>`<div class='item'><b>${d.name}</b><br><span class='tag'>${d.trait}</span><span class='tag'>技能 ${d.skill}</span><span class='tag'>疲劳 ${Math.round(d.fatigue)}</span><span class='tag'>月薪 ${fmt(d.wage)}</span><p>${d.trait==='稳健'?'降低事故和磨损':d.trait==='猛干'?'进度更快但更累':d.trait==='会谈'?'对回款更有帮助':d.trait==='老手'?'效率和稳定性好':d.trait==='省油'?'降低油费':'可能临时掉链子'}</p><div class='barbox'><div class='bar' style='width:${100-d.fatigue}%;background:${color(100-d.fatigue)}'></div></div></div>`).join('');$('salesBox').innerHTML=g.sales.map((s,i)=>`<div class='item'><b>${s.name}</b><br><span class='tag'>价格 ${fmt(s.price)}</span><span class='tag'>综合 ${health(s)}</span><span class='tag'>车龄 ${s.age}年</span><p>${s.brand}：油耗 ${B[s.brand].fuel.toFixed(2)}，可靠 ${Math.round(B[s.brand].rel*100)}%，残值基础 ${fmt(B[s.brand].resale)}。</p><button onclick='buy(${i})'>买入</button></div>`).join('');$('sellBox').innerHTML=g.fleet.map(m=>`<div class='item'><b>${m.name}</b><p>综合健康 ${health(m)}。旺季卖价更高，活少时折价。</p><button class='redbtn' onclick='sell(${m.id})'>出售估价</button></div>`).join('');$('receBox').innerHTML=g.rece.length?g.rece.map(r=>`<div class='item'><b>${r.name}</b><p>金额 ${fmt(r.amount)}｜预计第 ${r.due} 天｜账龄 ${r.age} 天｜坏账风险 ${Math.round(r.bad*100)}%</p></div>`).join(''):'<div class=item>暂无应收款。</div>';$('reportBox').innerHTML=`<div class='item'><b>累计报表</b><p>收入 ${fmt(g.pnl.rev)}｜施工成本 ${fmt(g.pnl.cost)}｜维修/事故 ${fmt(g.pnl.repair)}｜工资 ${fmt(g.pnl.wage)}｜利息 ${fmt(g.pnl.interest)}｜其他 ${fmt(g.pnl.other)}</p><p>估算经营利润：${fmt(g.pnl.rev-g.pnl.cost-g.pnl.repair-g.pnl.wage-g.pnl.interest-g.pnl.other)}</p></div>`;$('advice').textContent=advice();$('log').innerHTML=g.log.map(x=>'<div>'+x+'</div>').join('');if(g.cash<-100000)finish()}window.accept=accept;window.repair=repair;window.addAttach=addAttach;window.buy=buy;window.sell=sell;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('nextDay').onclick=workOneDay;$('hireDriver').onclick=hire;$('train').onclick=train;$('bonus').onclick=bonus;$('loan10').onclick=()=>loan(100000);$('loan30').onclick=()=>loan(300000);$('repay').onclick=repay;$('insure').onclick=insure;$('refreshContracts').onclick=refreshContracts;$('refreshSales').onclick=refreshSales;$('save').onclick=save;$('load').onclick=load;$('reset').onclick=init;$('again').onclick=()=>{$('modal').style.display='none';init()};init()})();</script></body></html>
