<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>挖机老板模拟器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#111820;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif}header{position:sticky;top:0;z-index:2;background:#17202b;border-bottom:1px solid #2e3b48;padding:16px 14px}h1{font-size:22px;margin:0}.sub{color:#aeb9c6;font-size:13px;margin-top:6px;line-height:1.45}main{max-width:760px;margin:0 auto;padding:12px}.card{background:#1b2530;border:1px solid #2e3b48;border-radius:16px;padding:13px;margin-bottom:12px}h2{font-size:17px;margin:0 0 10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#121a24;border:1px solid #2e3b48;border-radius:12px;padding:10px}.k{font-size:12px;color:#aeb9c6}.v{font-size:19px;font-weight:800;margin-top:3px}.red{color:#ff7575}.green{color:#62d996}.yellow{color:#ffd166}button{width:100%;min-height:46px;border:0;border-radius:13px;background:#f5b642;color:#16120a;font-size:16px;font-weight:800;margin-top:8px;padding:10px 12px}button:disabled{opacity:.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gray{background:#dce6ee}.greenbtn{background:#78dda7}.redbtn{background:#ff8b8b}.job{background:#121a24;border:1px solid #2e3b48;border-radius:14px;padding:12px;margin-bottom:10px}.job b{font-size:16px}.job p{font-size:13px;line-height:1.55;color:#bac6d1;margin:6px 0}.tag{display:inline-block;font-size:12px;color:#b8c4cf;background:#202b38;border-radius:999px;padding:3px 8px;margin-top:4px}.machine{padding:9px 0;border-bottom:1px solid #2e3b48}.machine:last-child{border-bottom:0}.barbox{margin-top:6px;height:10px;border-radius:99px;background:#0c1118;overflow:hidden}.bar{height:100%}#log{max-height:260px;overflow:auto;font-size:13px;line-height:1.55;color:#dce5ed}#log div{padding:6px 0;border-bottom:1px dashed #344354}#yard{height:128px;background:linear-gradient(#1b2b3a 0 58%,#6a4a30 58%);border-radius:14px;border:1px solid #2e3b48;position:relative;overflow:hidden;margin-top:10px}.sun{position:absolute;right:28px;top:18px;width:28px;height:28px;background:#f5b642;border-radius:50%}.mini{position:absolute;bottom:22px;font-size:36px}.advice{font-size:14px;line-height:1.65;color:#e7edf3}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9;align-items:center;justify-content:center;padding:18px}.box{background:#1b2530;border:1px solid #2e3b48;border-radius:18px;padding:18px;max-width:460px}
</style>
</head>
<body>
<header><h1>🚜 挖机老板模拟器</h1><div class="sub">30 天经营挑战：接工程、控成本、养设备、还贷款，看看你能不能做成机械老板。</div></header>
<main>
<section class="card"><h2>公司状态</h2><div class="stats"><div class="stat"><div class="k">日期</div><div class="v" id="day"></div></div><div class="stat"><div class="k">现金</div><div class="v" id="cash"></div></div><div class="stat"><div class="k">贷款</div><div class="v red" id="loan"></div></div><div class="stat"><div class="k">口碑</div><div class="v" id="rep"></div></div><div class="stat"><div class="k">油价指数</div><div class="v yellow" id="fuel"></div></div><div class="stat"><div class="k">挖机数量</div><div class="v" id="count"></div></div></div><div id="yard"><div class="sun"></div></div></section>
<section class="card"><h2>今日工程</h2><div id="jobs"></div><button class="gray" id="nextDayBtn">结束今天</button></section>
<section class="card"><h2>设备与操作</h2><div id="fleet"></div><div class="row"><button id="buyBtn">买二手挖机<br>¥180,000</button><button class="greenbtn" id="hireBtn">雇司机<br>¥10,000</button></div><div class="row"><button class="gray" id="repairBtn">全体保养</button><button class="redbtn" id="repayBtn">还款 ¥50,000</button></div></section>
<section class="card"><h2>经营建议</h2><div class="advice" id="advice"></div><div class="row"><button class="gray" id="saveBtn">保存</button><button class="gray" id="loadBtn">读取</button></div><button class="redbtn" id="resetBtn">重新开始</button></section>
<section class="card"><h2>经营日志</h2><div id="log"></div></section>
</main>
<div class="modal" id="modal"><div class="box"><h2 id="endTitle"></h2><p id="endText" style="line-height:1.7;color:#dce5ed"></p><button id="againBtn">再来一局</button></div></div>
<script>
(function(){
const fmt=n=>'¥'+Math.round(n).toLocaleString('zh-CN'),rand=(a,b)=>Math.random()*(b-a)+a,pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let g;
function start(){g={day:1,cash:120000,loan:260000,rep:52,fuel:1,drivers:0,done:0,fleet:[{name:'小松 PC200',health:82,busy:false}],jobs:[],log:['你用一台挖机开始创业：现金 ¥120,000，贷款 ¥260,000。']};makeJobs();render()}
function makeJobs(){const pool=[['乡镇挖沟','小活，结款快，风险低。',9000,15000,.08],['工地基础开挖','收入不错，但磨损较大。',15000,26000,.18],['河道清淤','环境复杂，容易坏车。',18000,30000,.26],['矿山短租','钱多，但油耗和磨损都高。',23000,38000,.34],['小区回填','稳定活，适合保现金流。',11000,19000,.12],['抢工期夜班','高利润，但事故风险高。',22000,36000,.38],['市政管网','验收严格，做好能涨口碑。',16000,28000,.20],['私人老板急活','价格高，但拖款概率大。',18000,33000,.31]];const num=g.rep>70?5:g.rep>40?4:3;g.jobs=[];for(let i=0;i<num;i++){const p=pick(pool);g.jobs.push({id:i,title:p[0],desc:p[1],pay:rand(p[2],p[3])*(1+g.rep/260),fuel:rand(1600,4300)*g.fuel,wear:rand(5,14)*(1+p[4]),risk:p[4],done:false})}}
function freeMachine(){return g.fleet.find(m=>!m.busy&&m.health>20)}
function doJob(id){const j=g.jobs.find(x=>x.id===Number(id));if(!j||j.done)return;const m=freeMachine();if(!m){log('没有可用挖机。健康度低于 20 要先保养。');return}j.done=true;m.busy=true;let income=j.pay,cost=j.fuel,rep=1,extra='';const risk=j.risk+(m.health<45?.18:0);if(Math.random()<risk){const loss=rand(4500,16000);cost+=loss;rep-=2;m.health-=rand(5,12);extra=' 但出了问题，额外损失 '+fmt(loss)+'。'}else if(Math.random()<.18+g.rep/350){const bonus=income*rand(.05,.15);income+=bonus;rep+=2;extra=' 完工漂亮，甲方加钱 '+fmt(bonus)+'。'}m.health=clamp(m.health-j.wear,0,100);g.cash+=income-cost;g.rep=clamp(g.rep+rep,0,100);g.done++;log('完成【'+j.title+'】：收入 '+fmt(income)+'，成本 '+fmt(cost)+'，净赚 '+fmt(income-cost)+'。'+extra);render()}
function nextDay(){if(g.day>=30){endGame();return}const driverCost=g.drivers*333,interest=g.loan*.0009,yard=g.fleet.length*180;g.cash-=driverCost+interest+yard;g.loan+=interest;g.fleet.forEach(m=>{m.busy=false;if(Math.random()<.05)m.health=clamp(m.health-rand(2,6),0,100)});g.fuel=clamp(g.fuel+rand(-.08,.10),.78,1.35);if(Math.random()<.22){const e=pick([()=>{g.cash+=6000;return'之前尾款到账 ¥6,000。'},()=>{g.cash-=3800;return'拖车和杂费支出 ¥3,800。'},()=>{g.rep=clamp(g.rep+3,0,100);return'老客户介绍新活，口碑 +3。'},()=>{g.fuel=clamp(g.fuel+.12,.78,1.35);return'柴油涨价，油费压力变大。'}]);log('随机事件：'+e())}g.day++;log('进入第 '+g.day+' 天。固定支出：'+fmt(driverCost+interest+yard)+'。');makeJobs();render()}
function buy(){if(g.cash<180000){log('现金不够，暂时别买车。');return}g.cash-=180000;g.fleet.push({name:pick(['三一 215','日立 ZX200','卡特 320D','斗山 DX220','柳工 922E']),health:rand(62,86),busy:false});log('买入一台二手挖机，产能提升，但维修压力也更大。');render()}
function hire(){if(g.drivers>=g.fleet.length){log('司机数量已经够了。');return}if(g.cash<10000){log('现金不足，暂时不适合招司机。');return}g.cash-=10000;g.drivers++;log('新招一名司机，预支和安置成本 ¥10,000。');render()}
function repair(){let cost=0;g.fleet.forEach(m=>cost+=(100-m.health)*520);cost=Math.round(cost);if(cost<=0){log('设备状态很好，不需要保养。');return}if(g.cash<cost){log('保养需要 '+fmt(cost)+'，现金不足。');return}g.cash-=cost;g.fleet.forEach(m=>m.health=100);log('全体保养完成，花费 '+fmt(cost)+'。');render()}
function repay(){const a=Math.min(50000,g.loan);if(g.cash<a){log('现金不足，还不了这笔款。');return}g.cash-=a;g.loan-=a;log('主动还款 '+fmt(a)+'。');render()}
function advice(){const avg=g.fleet.reduce((s,m)=>s+m.health,0)/g.fleet.length;if(g.cash<30000)return'现金流危险：优先接低风险、结款快的小活。';if(avg<45)return'设备健康偏低：再硬干容易赚的钱都进修理厂。';if(g.loan>350000)return'负债偏高：先还贷款，别盲目扩张。';if(g.cash>220000&&g.fleet.length<3)return'现金较充足：可以考虑买二手挖机，但要留维修和司机预算。';return'稳住节奏：高风险工程只在现金充足、设备健康时接。'}
function log(t){g.log.unshift('• '+t);g.log=g.log.slice(0,50)}
function endGame(){const asset=g.fleet.reduce((s,m)=>s+110000*(m.health/100),0),net=g.cash+asset-g.loan;document.getElementById('endTitle').textContent=net>350000&&g.rep>65?'你成了靠谱的机械老板':net>0?'公司活下来了':'现金流断裂';document.getElementById('endText').textContent='30 天结束，净资产约 '+fmt(net)+'，口碑 '+Math.round(g.rep)+'。真正的经营不是猛冲，是现金流、风险和设备状态的平衡。';document.getElementById('modal').style.display='flex'}
function save(){try{localStorage.setItem('wajiBossMobile',JSON.stringify(g));log('已保存到手机浏览器本地。')}catch(e){log('保存失败：请用 Safari 打开。')}render()}
function load(){try{const d=localStorage.getItem('wajiBossMobile');if(!d){log('没有找到存档。');render();return}g=JSON.parse(d);log('已读取存档。')}catch(e){log('读取失败，请用 Safari 打开。')}render()}
function render(){document.getElementById('day').textContent=g.day+' / 30';document.getElementById('cash').textContent=fmt(g.cash);document.getElementById('cash').className='v '+(g.cash<30000?'red':g.cash>200000?'green':'');document.getElementById('loan').textContent=fmt(g.loan);document.getElementById('rep').textContent=Math.round(g.rep);document.getElementById('rep').className='v '+(g.rep<35?'red':g.rep>70?'green':'');document.getElementById('fuel').textContent=g.fuel.toFixed(2);document.getElementById('count').textContent=g.fleet.length;const jobs=document.getElementById('jobs');jobs.innerHTML='';g.jobs.forEach(j=>{const div=document.createElement('div');div.className='job';div.innerHTML='<b>'+j.title+'</b><br><span class="tag">风险 '+Math.round(j.risk*100)+'%</span><p>'+j.desc+'</p><p>预计收入：'+fmt(j.pay)+'｜油费：'+fmt(j.fuel)+'｜磨损：'+Math.round(j.wear)+'</p>';const btn=document.createElement('button');btn.textContent=j.done?'已完成':'接这个活';btn.disabled=j.done;btn.onclick=()=>doJob(j.id);div.appendChild(btn);jobs.appendChild(div)});const fleet=document.getElementById('fleet');fleet.innerHTML='';g.fleet.forEach((m,i)=>{const color=m.health<35?'#ff7070':m.health<65?'#ffd166':'#55d18f',div=document.createElement('div');div.className='machine';div.innerHTML='<b>'+(i+1)+'. '+m.name+'</b><div class="sub">状态：'+(m.busy?'施工中':'空闲')+'｜健康度 '+Math.round(m.health)+'</div><div class="barbox"><div class="bar" style="width:'+m.health+'%;background:'+color+'"></div></div>';fleet.appendChild(div)});const yard=document.getElementById('yard');yard.querySelectorAll('.mini').forEach(e=>e.remove());g.fleet.slice(0,6).forEach((m,i)=>{const e=document.createElement('div');e.className='mini';e.textContent='🚜';e.style.left=(24+i*50)+'px';e.style.opacity=m.health<35?.45:1;yard.appendChild(e)});document.getElementById('advice').textContent=advice();document.getElementById('log').innerHTML=g.log.map(x=>'<div>'+x+'</div>').join('');if(g.cash<-50000)endGame()}
['nextDayBtn','buyBtn','hireBtn','repairBtn','repayBtn','saveBtn','loadBtn','resetBtn','againBtn'].forEach(id=>{document.getElementById(id).onclick={nextDayBtn:nextDay,buyBtn:buy,hireBtn:hire,repairBtn:repair,repayBtn:repay,saveBtn:save,loadBtn:load,resetBtn:start,againBtn:()=>{document.getElementById('modal').style.display='none';start()}}[id]});start();
})();
</script>
</body>
</html>
