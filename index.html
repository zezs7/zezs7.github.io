<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>数字方块 2048</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#0f1720;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif}main{max-width:560px;margin:0 auto;padding:14px}header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}h1{font-size:28px;margin:0}.sub{font-size:12px;color:#9fb0c4;line-height:1.45;margin-top:4px}.scores{display:flex;gap:8px}.score{background:#1b2938;border:1px solid #33485f;border-radius:14px;padding:8px 12px;text-align:center;min-width:86px}.k{font-size:11px;color:#9fb0c4}.v{font-size:20px;font-weight:900}.panel{background:#162231;border:1px solid #33485f;border-radius:18px;padding:12px;margin-bottom:12px}.bar{display:flex;gap:8px}.bar button{flex:1}button{border:0;border-radius:13px;min-height:44px;background:#f2b642;color:#171105;font-size:14px;font-weight:900;padding:8px 10px}button.dark{background:#26384a;color:#f4f7fb;border:1px solid #40566e}.board{position:relative;aspect-ratio:1/1;background:#101923;border:1px solid #33485f;border-radius:20px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;touch-action:none;overflow:hidden}.cell{background:#1a2939;border-radius:15px}.tile{position:absolute;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:1000;color:#10202d;transition:transform .12s ease,opacity .12s ease;box-shadow:0 8px 20px rgba(0,0,0,.22)}.n2{background:#d9edf7}.n4{background:#b9def4}.n8{background:#8ed1ff}.n16{background:#69e0bd}.n32{background:#79e084}.n64{background:#ffd166}.n128{background:#ffb75e;font-size:26px}.n256{background:#ff985e;font-size:26px}.n512{background:#ff7676;font-size:26px;color:#fff}.n1024{background:#b78cff;font-size:22px;color:#fff}.n2048,.n4096,.n8192{background:#f2b642;font-size:22px;color:#fff}.hint{font-size:13px;color:#c2cfdd;line-height:1.6}.keys{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:260px;margin:12px auto 0}.keys button{background:#26384a;color:#fff}.empty{visibility:hidden}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px}.dialog{background:#162231;border:1px solid #40566e;border-radius:22px;padding:20px;max-width:420px;text-align:center}.dialog h2{font-size:26px;margin:0 0 8px}.badge{display:inline-block;background:#26384a;border:1px solid #40566e;border-radius:999px;padding:4px 9px;color:#c8d6e6;font-size:12px;margin:2px}@media(max-width:520px){h1{font-size:24px}.tile{font-size:26px}.n128,.n256,.n512{font-size:22px}.n1024,.n2048{font-size:18px}main{padding:10px}.board{gap:8px;padding:8px}}</style></head><body><main><header><div><h1>数字方块 2048</h1><div class="sub">滑动合并相同数字。越到后面越考验空间感和耐心。</div></div><div class="scores"><div class="score"><div class="k">分数</div><div class="v" id="score">0</div></div><div class="score"><div class="k">最高</div><div class="v" id="best">0</div></div></div></header><section class="panel"><div class="bar"><button id="new">新游戏</button><button class="dark" id="undo">悔一步</button><button class="dark" id="auto">提示</button></div><div style="margin-top:10px"><span class="badge">手机滑动</span><span class="badge">键盘方向键</span><span class="badge">支持悔棋</span></div></section><div class="board" id="board"></div><section class="panel" style="margin-top:12px"><div class="hint" id="hint">建议：尽量把最大数字固定在一个角落，不要频繁打乱阵型。</div><div class="keys"><span></span><button data-m="up">↑</button><span></span><button data-m="left">←</button><button data-m="down">↓</button><button data-m="right">→</button></div></section></main><div class="modal" id="modal"><div class="dialog"><h2 id="mt">游戏结束</h2><p id="md" class="hint"></p><button id="again" style="width:100%">再来一局</button></div></div><script>(()=>{const $=id=>document.getElementById(id),B=$('board'),N=4;let grid,score,best=+localStorage.best2048||0,prev=null,won=false;const tips=['把最大数字固定在角落。','不要让大数字散落四处。','优先保持一整行有序。','空格比高分更重要。','连续合并前，先看下一步会不会堵死。'];function init(){grid=Array.from({length:N},()=>Array(N).fill(0));score=0;won=false;prev=null;add();add();draw();msg('建议：尽量把最大数字固定在一个角落，不要频繁打乱阵型。');$('modal').style.display='none'}function add(){let a=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])a.push([r,c]);if(!a.length)return;let [r,c]=a[Math.floor(Math.random()*a.length)];grid[r][c]=Math.random()<.9?2:4}function clone(){return grid.map(r=>r.slice())}function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}function move(dir){prev={grid:clone(),score};let moved=false,g=clone();function line(arr){let x=arr.filter(Boolean),out=[],gain=0;for(let i=0;i<x.length;i++){if(x[i]===x[i+1]){let v=x[i]*2;out.push(v);gain+=v;i++}else out.push(x[i])}while(out.length<N)out.push(0);return{out,gain}}for(let i=0;i<N;i++){let arr=[];for(let j=0;j<N;j++){let r=dir==='up'?j:dir==='down'?N-1-j:i,c=dir==='left'?j:dir==='right'?N-1-j:i;arr.push(g[r][c])}let res=line(arr);score+=res.gain;for(let j=0;j<N;j++){let r=dir==='up'?j:dir==='down'?N-1-j:i,c=dir==='left'?j:dir==='right'?N-1-j:i;if(g[r][c]!==res.out[j])moved=true;g[r][c]=res.out[j]}}if(!moved){prev=null;return}grid=g;add();if(score>best){best=score;localStorage.best2048=best}draw();let max=Math.max(...grid.flat());if(max>=2048&&!won){won=true;openModal('你合成了 2048！','很稳。可以继续挑战更高数字。')}if(over())openModal('游戏结束','最终分数 '+score+'。真正的高手靠布局，不靠运气。')}function over(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!grid[r][c])return false;if(r<N-1&&grid[r][c]===grid[r+1][c])return false;if(c<N-1&&grid[r][c]===grid[r][c+1])return false}return true}function draw(){B.innerHTML='';for(let i=0;i<16;i++){let d=document.createElement('div');d.className='cell';B.appendChild(d)}let rect=B.getBoundingClientRect(),gap=parseFloat(getComputedStyle(B).gap),pad=parseFloat(getComputedStyle(B).paddingLeft),size=(rect.width-pad*2-gap*3)/4;for(let r=0;r<N;r++)for(let c=0;c<N;c++){let v=grid[r][c];if(!v)continue;let t=document.createElement('div');t.className='tile n'+v;t.textContent=v;t.style.width=size+'px';t.style.height=size+'px';t.style.transform=`translate(${pad+c*(size+gap)}px,${pad+r*(size+gap)}px)`;B.appendChild(t)}$('score').textContent=score;$('best').textContent=best}function undo(){if(!prev)return msg('没有可以悔棋的步骤。');grid=prev.grid;score=prev.score;prev=null;draw();msg('已回退一步。')}function msg(t){$('hint').textContent=t}function openModal(t,d){$('mt').textContent=t;$('md').textContent=d;$('modal').style.display='flex'}function suggest(){let dirs=['left','down','right','up'],bestDir='left',bestVal=-1;for(let d of dirs){let save=clone(),s=score;moveSilent(d);let empty=grid.flat().filter(x=>!x).length,max=Math.max(...grid.flat()),smooth=0;for(let r=0;r<N;r++)for(let c=0;c<N-1;c++)if(grid[r][c]>=grid[r][c+1])smooth++;let val=empty*10+Math.log2(max)*3+smooth;if(!same(grid,save)&&val>bestVal){bestVal=val;bestDir=d}grid=save;score=s}msg('提示：可以考虑 '+({left:'向左',right:'向右',up:'向上',down:'向下'}[bestDir])+'。')}function moveSilent(dir){let g=clone();function line(arr){let x=arr.filter(Boolean),out=[];for(let i=0;i<x.length;i++){if(x[i]===x[i+1]){out.push(x[i]*2);i++}else out.push(x[i])}while(out.length<N)out.push(0);return out}for(let i=0;i<N;i++){let arr=[];for(let j=0;j<N;j++){let r=dir==='up'?j:dir==='down'?N-1-j:i,c=dir==='left'?j:dir==='right'?N-1-j:i;arr.push(g[r][c])}let out=line(arr);for(let j=0;j<N;j++){let r=dir==='up'?j:dir==='down'?N-1-j:i,c=dir==='left'?j:dir==='right'?N-1-j:i;g[r][c]=out[j]}}grid=g}document.onkeydown=e=>{let m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(m){e.preventDefault();move(m)}};let sx=0,sy=0;B.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});B.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>move(b.dataset.m));$('new').onclick=init;$('again').onclick=init;$('undo').onclick=undo;$('auto').onclick=suggest;window.onresize=draw;init()})();</script></body></html>
