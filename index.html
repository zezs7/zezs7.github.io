<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>数独大师</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#0f1720;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',Arial,sans-serif}main{max-width:680px;margin:0 auto;padding:12px}header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}h1{font-size:28px;margin:0}.sub{font-size:12px;color:#9fb0c4;line-height:1.45;margin-top:4px}.pill{display:inline-block;background:#213044;border:1px solid #33485f;border-radius:999px;padding:4px 8px;color:#c7d3e0;font-size:12px;margin:2px}.top{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.stat{background:#162231;border:1px solid #33485f;border-radius:14px;padding:8px;text-align:center}.k{font-size:11px;color:#9fb0c4}.v{font-size:18px;font-weight:900}.panel{background:#162231;border:1px solid #33485f;border-radius:18px;padding:10px;margin-bottom:10px}.bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}button,select{border:0;border-radius:13px;min-height:42px;background:#f2b642;color:#171105;font-size:14px;font-weight:900;padding:8px 10px}select{width:100%;background:#26384a;color:#fff;border:1px solid #40566e}button.dark{background:#26384a;color:#f4f7fb;border:1px solid #40566e}button.red{background:#ff7b7b;color:#1b0909}.board{width:100%;aspect-ratio:1/1;background:#eef3f8;border:4px solid #d9e4ef;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);box-shadow:0 12px 30px rgba(0,0,0,.28);touch-action:manipulation}.cell{position:relative;display:flex;align-items:center;justify-content:center;background:#f7fbff;color:#142033;font-size:25px;font-weight:900;border-right:1px solid #b7c5d4;border-bottom:1px solid #b7c5d4}.cell:nth-child(3n){border-right:3px solid #708196}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #708196}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+73){border-bottom:0}.fixed{color:#101820;background:#e4edf6}.sel{background:#ffe6a6!important}.peer{background:#e5f1ff}.same{background:#d4f7e6}.bad{color:#e03b3b}.emptybad{box-shadow:inset 0 0 0 3px #ff8d8d}.notegrid{position:absolute;inset:3px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:10px;color:#57708c;font-weight:800}.notegrid span{display:flex;align-items:center;justify-content:center}.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.pad button{min-height:48px;font-size:19px}.hint{font-size:13px;color:#c2cfdd;line-height:1.6}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.dialog{background:#162231;border:1px solid #40566e;border-radius:22px;padding:20px;max-width:420px;text-align:center}.dialog h2{font-size:26px;margin:0 0 8px}@media(max-width:520px){main{padding:9px}h1{font-size:24px}.cell{font-size:21px}.top{grid-template-columns:repeat(2,1fr)}.bar{grid-template-columns:1fr 1fr}.pad{grid-template-columns:repeat(5,1fr);gap:6px}.pad button{min-height:44px;font-size:17px}.notegrid{font-size:8px}}</style></head><body><main><header><div><h1>数独大师</h1><div class="sub">填入 1-9，让每行、每列、每个 3×3 宫都不重复。支持手机点击、笔记、提示、检查。</div></div></header><section class="top"><div class="stat"><div class="k">难度</div><div class="v" id="lv">普通</div></div><div class="stat"><div class="k">时间</div><div class="v" id="time">00:00</div></div><div class="stat"><div class="k">错误</div><div class="v" id="err">0</div></div><div class="stat"><div class="k">提示</div><div class="v" id="hints">3</div></div></section><section class="panel"><div class="bar"><select id="difficulty"><option value="easy">简单</option><option value="normal" selected>普通</option><option value="hard">困难</option><option value="expert">专家</option></select><button id="new">新游戏</button><button class="dark" id="note">笔记：关</button><button class="dark" id="check">检查</button><button class="dark" id="hint">提示</button><button class="red" id="solve">看答案</button></div><div style="margin-top:8px"><span class="pill">点击格子</span><span class="pill">数字键填入</span><span class="pill">笔记模式</span><span class="pill">自动判错</span></div></section><div class="board" id="board"></div><div class="pad" id="pad"></div><section class="panel" style="margin-top:10px"><div class="hint" id="msg">先选择一个空格，再点数字。建议先找“某行/某列只缺一个数”的位置。</div></section></main><div class="modal" id="modal"><div class="dialog"><h2 id="mt">完成！</h2><p id="md" class="hint"></p><button id="again" style="width:100%">再来一局</button></div></div><script>(()=>{const $=id=>document.getElementById(id),side=9,base=3,range=n=>[...Array(n).keys()],shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let sol,puz,val,fix,notes,sel=-1,noteMode=false,errors=0,hints=3,start=Date.now(),timer=null,finished=false;const blanks={easy:38,normal:46,hard:53,expert:58},names={easy:'简单',normal:'普通',hard:'困难',expert:'专家'};function pattern(r,c){return(base*(r%base)+Math.floor(r/base)+c)%side}function makeSolved(){let rows=shuffle(range(base)).flatMap(g=>shuffle(range(base)).map(r=>g*base+r)),cols=shuffle(range(base)).flatMap(g=>shuffle(range(base)).map(c=>g*base+c)),nums=shuffle(range(side).map(x=>x+1));return rows.map(r=>cols.map(c=>nums[pattern(r,c)]))}function copy(b){return b.map(r=>r.slice())}function flat(b){return b.flat()}function can(b,r,c,n){for(let i=0;i<9;i++)if(b[r][i]===n||b[i][c]===n)return false;let br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let i=0;i<3;i++)for(let j=0;j<3;j++)if(b[br+i][bc+j]===n)return false;return true}function countSolutions(b,limit=2){let best=null,cands=null;for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(!b[r][c]){let a=[];for(let n=1;n<=9;n++)if(can(b,r,c,n))a.push(n);if(!a.length)return 0;if(!best||a.length<cands.length){best=[r,c];cands=a;if(a.length===1)break}}if(!best)return 1;let total=0,[r,c]=best;for(let n of shuffle(cands)){b[r][c]=n;total+=countSolutions(b,limit);b[r][c]=0;if(total>=limit)return total}return total}function makePuzzle(level){sol=makeSolved();puz=copy(sol);let cells=shuffle(range(81)),target=blanks[level],removed=0,tries=0;for(let idx of cells){if(removed>=target||tries>180)break;tries++;let r=Math.floor(idx/9),c=idx%9,old=puz[r][c];puz[r][c]=0;let test=copy(puz);if(countSolutions(test,2)===1)removed++;else puz[r][c]=old}return puz}function newGame(){let level=$('difficulty').value;makePuzzle(level);val=flat(puz);fix=val.map(x=>!!x);notes=Array.from({length:81},()=>new Set());sel=-1;errors=0;hints=3;finished=false;start=Date.now();$('lv').textContent=names[level];$('modal').style.display='none';clearInterval(timer);timer=setInterval(tick,1000);tick();msg('新题已生成。先找空格少的行、列或九宫格。');render()}function tick(){let s=Math.floor((Date.now()-start)/1000),m=Math.floor(s/60);$('time').textContent=String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function render(){let b=$('board');b.innerHTML='';let selectedVal=sel>=0?val[sel]:0;for(let i=0;i<81;i++){let r=Math.floor(i/9),c=i%9,d=document.createElement('div');d.className='cell';if(fix[i])d.classList.add('fixed');if(sel===i)d.classList.add('sel');if(sel>=0){let sr=Math.floor(sel/9),sc=sel%9;if(i!==sel&&(r===sr||c===sc||Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3)))d.classList.add('peer');if(selectedVal&&val[i]===selectedVal)d.classList.add('same')}if(val[i]){d.textContent=val[i];if(val[i]!==sol[r][c])d.classList.add('bad')}else if(notes[i].size){let ng=document.createElement('div');ng.className='notegrid';for(let n=1;n<=9;n++){let s=document.createElement('span');s.textContent=notes[i].has(n)?n:'';ng.appendChild(s)}d.appendChild(ng)}d.onclick=()=>{sel=i;render()};b.appendChild(d)}$('err').textContent=errors;$('hints').textContent=hints;$('note').textContent='笔记：'+(noteMode?'开':'关')}function input(n){if(sel<0)return msg('先点一个空格。');if(fix[sel]||finished)return msg('这个是题目给定数字，不能改。');let r=Math.floor(sel/9),c=sel%9;if(n===0){val[sel]=0;notes[sel].clear();render();return}if(noteMode){if(val[sel])return msg('已有数字的格子不能写笔记。');notes[sel].has(n)?notes[sel].delete(n):notes[sel].add(n);render();return}val[sel]=n;notes[sel].clear();if(n!==sol[r][c]){errors++;msg('这个数字不对，注意同行、同列、同宫是否冲突。')}else{cleanNotes(r,c,n);msg('正确。继续推进。')}render();checkWin()}function cleanNotes(r,c,n){for(let i=0;i<9;i++){notes[r*9+i].delete(n);notes[i*9+c].delete(n)}let br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let i=0;i<3;i++)for(let j=0;j<3;j++)notes[(br+i)*9+bc+j].delete(n)}function checkBoard(){let wrong=0,empty=0;for(let i=0;i<81;i++){let r=Math.floor(i/9),c=i%9;if(!val[i])empty++;else if(val[i]!==sol[r][c])wrong++}if(!wrong&&!empty)win();else msg('检查结果：空格 '+empty+' 个，错误 '+wrong+' 个。')}function hint(){if(hints<=0)return msg('提示次数用完了。');let i=sel>=0&&!fix[sel]&&!val[sel]?sel:val.findIndex((x,i)=>!x&&!fix[i]);if(i<0)return checkWin();let r=Math.floor(i/9),c=i%9;val[i]=sol[r][c];notes[i].clear();hints--;sel=i;cleanNotes(r,c,val[i]);msg('已填入一个提示数字。');render();checkWin()}function solve(){for(let i=0;i<81;i++)val[i]=sol[Math.floor(i/9)][i%9];finished=true;render();openModal('答案已显示','这局可以复盘：看看哪些位置本来可以通过排除法推出。')}function checkWin(){for(let i=0;i<81;i++){let r=Math.floor(i/9),c=i%9;if(val[i]!==sol[r][c])return}win()}function win(){finished=true;clearInterval(timer);let t=$('time').textContent,lv=$('difficulty').value,key='bestSudoku_'+lv,best=localStorage[key];if(!best||toSec(t)<toSec(best)){localStorage[key]=t;best=t}openModal('恭喜完成！','难度：'+names[lv]+'｜用时：'+t+'｜错误：'+errors+'｜该难度最佳：'+best)}function toSec(t){let [m,s]=t.split(':').map(Number);return m*60+s}function openModal(t,d){$('mt').textContent=t;$('md').textContent=d;$('modal').style.display='flex'}function msg(t){$('msg').textContent=t}function buildPad(){let p=$('pad');p.innerHTML='';for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.onclick=()=>input(n);p.appendChild(b)}let e=document.createElement('button');e.textContent='清除';e.className='dark';e.onclick=()=>input(0);p.appendChild(e)}document.onkeydown=e=>{if(e.key>='1'&&e.key<='9')input(+e.key);if(e.key==='Backspace'||e.key==='Delete')input(0)};$('new').onclick=newGame;$('note').onclick=()=>{noteMode=!noteMode;render()};$('check').onclick=checkBoard;$('hint').onclick=hint;$('solve').onclick=solve;$('again').onclick=newGame;buildPad();newGame()})();</script></body></html>
